name: deploy

# Disabled: this repository is archived. Production deploys are not run from
# archived repositories. Re-enable by removing the `if: false` below only if
# the repo is unarchived and DEPLOY_SSH_KEY/DEPLOY_HOST/DEPLOY_USER secrets
# are re-provisioned.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: false  # archived repo — no deploy
    runs-on: [self-hosted, Linux, X64, server-nddev-amsterdam]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2  # v4.0.0

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship tracked tree to the server
        run: |
          git archive HEAD | ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'tar -x -C /srv/nornikel-kg-search'

      - name: Build and restart
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd /srv/nornikel-kg-search
            docker compose -f docker-compose.server.yml build api web
            docker compose -f docker-compose.server.yml up -d
          '

      - name: Smoke check
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            sleep 12
            curl -fsS -m 20 http://127.0.0.1:8080/api/health
            curl -fsS -m 20 http://127.0.0.1:8080/api/stats/overview >/dev/null
            echo " smoke ok"
          '
