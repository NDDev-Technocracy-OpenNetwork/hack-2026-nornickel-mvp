name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (python)
    uses: NDDev-it-com/ci-workflows/.github/workflows/python-ci.yml@c26c516559c01166a35b852c0d2a925cc1bd8db8
    with:
      runner: "self-hosted, Linux, X64, server-nddev-amsterdam"
      python_version: '3.12'
      install_command: 'uv sync --group dev'
      test_command: 'uv run ruff check . && uv run mypy && uv run pytest'

  frontend:
    name: frontend (node)
    uses: NDDev-it-com/ci-workflows/.github/workflows/node-ci.yml@c26c516559c01166a35b852c0d2a925cc1bd8db8
    with:
      runner: "self-hosted, Linux, X64, server-nddev-amsterdam"
      working_directory: apps/web
      install_command: 'npm ci --no-audit'
      test_command: 'npm run typecheck && npm run build'

  zizmor:
    uses: NDDev-it-com/ci-workflows/.github/workflows/zizmor-no-sarif.yml@c26c516559c01166a35b852c0d2a925cc1bd8db8

  secret-scan:
    uses: NDDev-it-com/ci-workflows/.github/workflows/secret-scan.yml@c26c516559c01166a35b852c0d2a925cc1bd8db8

  actionlint:
    uses: NDDev-it-com/ci-workflows/.github/workflows/actionlint.yml@c26c516559c01166a35b852c0d2a925cc1bd8db8
    with:
      runner: "self-hosted, Linux, X64, server-nddev-amsterdam"
