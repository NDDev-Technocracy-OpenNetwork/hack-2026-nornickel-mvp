name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (python)
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/python-ci.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      uv_version: "0.12.23"
      runner: ubuntu-latest
      python_version: '3.12'
      install_command: 'uv sync --group dev'
      test_command: 'uv run ruff check . && uv run mypy && uv run pytest'

  frontend:
    name: frontend (node)
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/node-ci.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      package_manager: npm
      node_version: "24.21.0"
      npm_version: "11.19.0"
      runner: ubuntu-latest
      working_directory: apps/web
      install_command: 'npm ci --no-audit'
      test_command: 'npm run typecheck && npm run build'

  zizmor:
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/zizmor-no-sarif.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046

  secret-scan:
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/secret-scan.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046

  actionlint:
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/actionlint.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
    with:
      runner: ubuntu-latest
